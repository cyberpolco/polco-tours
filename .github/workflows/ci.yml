name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    # Real Postgres so the RLS cross-tenant test (Phase 0 exit criterion) runs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polco
          POSTGRES_PASSWORD: polco
          POSTGRES_DB: polco_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U polco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # NOT the postgres:16 bootstrap user (see step below) — that role is an
      # initdb superuser and superusers always bypass Row-Level Security, which
      # would make the RLS cross-tenant test pass even with broken policies.
      DATABASE_URL: postgresql://polco_app:polco_app@localhost:5432/polco_test
      DIRECT_URL: postgresql://polco_app:polco_app@localhost:5432/polco_test
      BETTER_AUTH_SECRET: ci-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Create non-superuser app role (RLS must actually apply)
        run: |
          PGPASSWORD=polco psql -h localhost -U polco -d polco_test -v ON_ERROR_STOP=1 -c "
            CREATE ROLE polco_app LOGIN PASSWORD 'polco_app' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
            GRANT ALL PRIVILEGES ON DATABASE polco_test TO polco_app;
            GRANT ALL ON SCHEMA public TO polco_app;
          "

      - name: Prepare database (schema + sequences + RLS + seed)
        run: |
          npm run db:push
          npm run db:sequences
          npm run db:rls
          npm run db:seed

      - name: Unit + RLS tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality

    # Jobs don't share services -- mirrors `quality`'s Postgres bootstrap
    # exactly (own service, own polco_app role, own db:setup) since the app
    # under test needs a real seeded, RLS-enforcing DB (DR-014).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polco
          POSTGRES_PASSWORD: polco
          POSTGRES_DB: polco_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U polco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://polco_app:polco_app@localhost:5432/polco_test
      DIRECT_URL: postgresql://polco_app:polco_app@localhost:5432/polco_test
      BETTER_AUTH_SECRET: ci-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Real Vercel Blob store (polco-tours-documents, fra1, DR-015/OI-08) --
      # the current e2e spec still stops at the passport step's upload form
      # rather than submitting a real file, so this isn't exercised yet; it's
      # here so a future increment can extend that spec without a second trip
      # to wire up CI.
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Create non-superuser app role (RLS must actually apply)
        run: |
          PGPASSWORD=polco psql -h localhost -U polco -d polco_test -v ON_ERROR_STOP=1 -c "
            CREATE ROLE polco_app LOGIN PASSWORD 'polco_app' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
            GRANT ALL PRIVILEGES ON DATABASE polco_test TO polco_app;
            GRANT ALL ON SCHEMA public TO polco_app;
          "

      - name: Prepare database (schema + sequences + RLS + seed)
        run: |
          npm run db:push
          npm run db:sequences
          npm run db:rls
          npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # TEMP-DEBUG: investigating a persistent guest-checkout.spec.ts hang at
      # the addons->travelers transition under this job's 2-worker
      # concurrency. Playwright's own webServer teardown closes all DB
      # connections by the time the step exits, so a dump *after* `npm run
      # test:e2e` sees nothing -- this samples pg_stat_activity/pg_locks
      # every 2s *during* the run instead, from a background poller, so
      # whatever's actually stuck at the moment of the hang is on record.
      # Remove this whole step once root-caused.
      - name: E2E tests (with live Postgres activity sampling)
        run: |
          (
            while true; do
              echo "=== $(date -u +%H:%M:%S) ==="
              PGPASSWORD=polco psql -h localhost -U polco -d polco_test -t -A -c "
                SELECT pid, state, wait_event_type, wait_event, extract(epoch from (now()-query_start)), left(query,150)
                FROM pg_stat_activity WHERE datname='polco_test' AND pid <> pg_backend_pid() AND state <> 'idle';
              "
              sleep 2
            done
          ) > /tmp/pg-activity.log 2>&1 &
          POLLER_PID=$!
          npm run test:e2e
          TEST_EXIT=$?
          kill "$POLLER_PID" 2>/dev/null || true
          echo "::group::Postgres activity samples during the run (non-idle only, one block per 2s tick)"
          cat /tmp/pg-activity.log
          echo "::endgroup::"
          exit $TEST_EXIT

  # Non-blocking scan surface; hardened further in Vol. 8 §8.6.
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high || true
