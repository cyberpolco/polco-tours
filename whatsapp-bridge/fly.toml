# Fly.io app config for the WhatsApp bridge (DR-258). Generated by hand
# (not `fly launch`) to match this repo's existing Dockerfile.
#
# `app` is filled in by `fly apps create <name>` -- pick your own unique name
# and replace it below (or run `fly launch --no-deploy` once to have flyctl
# fill this file in for you, then re-apply the [[mounts]]/http_service
# settings from this file if it overwrites them).
app = "polco-whatsapp-bridge"
primary_region = "fra"  # Frankfurt -- matches this project's Neon/Blob EU residency

[build]

[env]
  WHATSAPP_BRIDGE_PORT = "8787"
  WHATSAPP_BRIDGE_AUTH_DIR = "/data/auth_info"

[[mounts]]
  source = "whatsapp_auth"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
